<!DOCTYPE html>
<html>
<head>
  <title>AI Chat with Document</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; }
    #userInput { width: 80%; padding: 10px; }
    #sendBtn { padding: 10px; }
  </style>
</head>
<body>
  <h2>Chat with AI about our Museum Document</h2>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="Ask a question..." />
  <button id="sendBtn">Send</button>

  <script>
    // Your document text as context
    const documentText = `
    Le Musée Virtuel Éco-Technologique est un espace immersif conçu pour sensibiliser aux enjeux du développement durable. 
    Il met en évidence le lien essentiel entre l’accès à l’eau potable et la santé humaine.
    À travers cet espace interactif, les visiteurs découvrent les défis environnementaux, les solutions technologiques innovantes,
    et les actions nécessaires pour construire un avenir plus sain et durable.
    `;

    const chatDiv = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendMessage() {
      const question = userInput.value;
      if (!question) return;

      // Display user message
      chatDiv.innerHTML += `<p><b>You:</b> ${question}</p>`;
      userInput.value = '';

      // Call OpenAI API (replace YOUR_API_KEY)
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer YOUR_API_KEY"
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [
            { role: "system", content: "You are an AI assistant. Answer questions based on the following document." },
            { role: "system", content: documentText },
            { role: "user", content: question }
          ],
          max_tokens: 200
        })
      });

      const data = await response.json();
      const answer = data.choices[0].message.content;
      chatDiv.innerHTML += `<p><b>AI:</b> ${answer}</p>`;
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
